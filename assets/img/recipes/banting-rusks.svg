<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs>
  <radialGradient id="bg" cx="50%" cy="34%" r="82%">
    <stop offset="0%" stop-color="#f3f6ef"/>
    <stop offset="62%" stop-color="#e6ece2"/>
    <stop offset="100%" stop-color="#d2ddd1"/>
  </radialGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#f3ece0"/>
  </linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#4a2c1c"/>
    <stop offset="100%" stop-color="#2b1710"/>
  </linearGradient>
  <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e8bd82"/>
    <stop offset="100%" stop-color="#d2a061"/>
  </linearGradient>
  <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e2ad68"/>
    <stop offset="100%" stop-color="#c68a44"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="18%" stop-color="#ffffff" stop-opacity="0.06"/>
    <stop offset="82%" stop-color="#ffffff" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
  </linearGradient>
  <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
  <filter id="blur-s" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<ellipse cx="600" cy="530" rx="400" ry="325" fill="#7d8c78" opacity="0.30" filter="url(#blur)"/>
<ellipse cx="600" cy="480" rx="360" ry="335" fill="#77866f" opacity="0.18" filter="url(#blur-s)"/>
<ellipse cx="600" cy="470" rx="355" ry="335" fill="url(#plate)"/>
<ellipse cx="600" cy="470" rx="355" ry="335" fill="none" stroke="#d9d3c3" stroke-width="3"/>
<ellipse cx="600" cy="470" rx="300" ry="282" fill="none" stroke="#e5dcc8" stroke-width="2"/>

<g>
  <ellipse cx="560" cy="560" rx="250" ry="60" fill="#8a6a3d" opacity="0.22" filter="url(#blur-s)"/>
  <!-- bottom rusk -->
  <g transform="translate(455 505) rotate(-8)">
    <rect x="-90" y="-55" width="180" height="110" rx="16" fill="#c68f4e"/>
    <rect x="-90" y="-55" width="180" height="34" rx="16" fill="#d9a768"/>
    <circle cx="-40" cy="10" r="4" fill="#a9713a" opacity="0.7"/>
    <circle cx="10" cy="26" r="3.5" fill="#a9713a" opacity="0.6"/>
    <circle cx="48" cy="4" r="4" fill="#a9713a" opacity="0.65"/>
    <circle cx="-8" cy="-6" r="3" fill="#e3bb84" opacity="0.8"/>
  </g>
  <!-- middle rusk -->
  <g transform="translate(660 470) rotate(9)">
    <rect x="-90" y="-55" width="180" height="110" rx="16" fill="#cd9755"/>
    <rect x="-90" y="-55" width="180" height="34" rx="16" fill="#dfae72"/>
    <circle cx="-46" cy="8" r="4" fill="#a9713a" opacity="0.65"/>
    <circle cx="4" cy="30" r="3.5" fill="#a9713a" opacity="0.6"/>
    <circle cx="44" cy="0" r="4" fill="#a9713a" opacity="0.6"/>
  </g>
  <!-- top rusk leaning -->
  <g transform="translate(560 375) rotate(-14)">
    <rect x="-95" y="-58" width="190" height="116" rx="18" fill="#d9a561"/>
    <rect x="-95" y="-58" width="190" height="36" rx="18" fill="#ecc189"/>
    <circle cx="-50" cy="14" r="4.5" fill="#b57c40" opacity="0.65"/>
    <circle cx="-4" cy="34" r="3.5" fill="#b57c40" opacity="0.6"/>
    <circle cx="46" cy="10" r="4" fill="#b57c40" opacity="0.6"/>
    <circle cx="20" cy="-6" r="3" fill="#f2d3a5" opacity="0.8"/>
  </g>
  <!-- crumbs -->
  <circle cx="330" cy="600" r="5" fill="#c68f4e" opacity="0.7"/>
  <circle cx="368" cy="622" r="3.5" fill="#d9a561" opacity="0.7"/>
  <circle cx="800" cy="590" r="4.5" fill="#c68f4e" opacity="0.6"/>
  <!-- coffee mug -->
  <g transform="translate(875 610)">
    <ellipse cx="0" cy="10" rx="95" ry="26" fill="#7a6248" opacity="0.25" filter="url(#blur-s)"/>
    <path d="M62 -20 q42 6 34 34 q-6 26 -40 22" fill="none" stroke="#16522f" stroke-width="14" stroke-linecap="round"/>
    <rect x="-72" y="-58" width="144" height="110" rx="26" fill="#1a6b3c"/>
    <ellipse cx="0" cy="-58" rx="72" ry="20" fill="#2d9058"/>
    <ellipse cx="0" cy="-58" rx="58" ry="14" fill="#5b3a24"/>
    <ellipse cx="-16" cy="-60" rx="22" ry="6" fill="#7a5133" opacity="0.8"/>
    <path d="M-30 -120 q14 -16 0 -30 M 8 -124 q14 -16 0 -30" stroke="#ffffff" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
  </g>
</g>
</svg>
