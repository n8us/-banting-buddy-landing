<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs>
  <radialGradient id="bg" cx="50%" cy="34%" r="82%">
    <stop offset="0%" stop-color="#f3f6ef"/>
    <stop offset="62%" stop-color="#e6ece2"/>
    <stop offset="100%" stop-color="#d2ddd1"/>
  </radialGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#f3ece0"/>
  </linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#4a2c1c"/>
    <stop offset="100%" stop-color="#2b1710"/>
  </linearGradient>
  <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e8bd82"/>
    <stop offset="100%" stop-color="#d2a061"/>
  </linearGradient>
  <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e2ad68"/>
    <stop offset="100%" stop-color="#c68a44"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="18%" stop-color="#ffffff" stop-opacity="0.06"/>
    <stop offset="82%" stop-color="#ffffff" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
  </linearGradient>
  <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
  <filter id="blur-s" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<ellipse cx="600" cy="530" rx="400" ry="325" fill="#7d8c78" opacity="0.30" filter="url(#blur)"/>
<ellipse cx="600" cy="480" rx="360" ry="335" fill="#77866f" opacity="0.18" filter="url(#blur-s)"/>
<ellipse cx="600" cy="470" rx="355" ry="335" fill="url(#plate)"/>
<ellipse cx="600" cy="470" rx="355" ry="335" fill="none" stroke="#d9d3c3" stroke-width="3"/>
<ellipse cx="600" cy="470" rx="300" ry="282" fill="none" stroke="#e5dcc8" stroke-width="2"/>

<g transform="translate(0 10)">
  <ellipse cx="600" cy="700" rx="180" ry="28" fill="#5c6658" opacity="0.35" filter="url(#blur-s)"/>
  <!-- glass body -->
  <path d="M470 300 L498 664 Q502 698 540 700 L660 700 Q698 698 702 664 L730 300 Z"
        fill="#ffffff" opacity="0.45"/>
  <!-- mousse -->
  <path d="M488 336 L510 656 Q513 682 544 684 L656 684 Q687 682 690 656 L712 336 Z" fill="url(#dark)"/>
  <!-- texture swirls -->
  <path d="M514 440 C 552 392, 604 470, 648 420 C 670 396, 688 414, 700 432"
        fill="none" stroke="#7a4f2f" stroke-width="15" stroke-linecap="round" opacity="0.5"/>
  <path d="M524 566 C 564 526, 614 592, 672 542"
        fill="none" stroke="#7a4f2f" stroke-width="12" stroke-linecap="round" opacity="0.4"/>
  <!-- cream layer seen from above -->
  <ellipse cx="600" cy="310" rx="126" ry="32" fill="#f7eedf"/>
  <ellipse cx="600" cy="310" rx="126" ry="32" fill="none" stroke="#e6d5b9" stroke-width="3"/>
  <!-- whipped dollop -->
  <circle cx="568" cy="292" r="24" fill="#fdf8ee"/>
  <circle cx="620" cy="288" r="26" fill="#fdf8ee"/>
  <circle cx="594" cy="272" r="24" fill="#fffcf6"/>
  <circle cx="596" cy="262" r="14" fill="#ffffff"/>
  <!-- chocolate curls -->
  <path d="M536 286 q16 -18 34 -6 q-14 2 -18 14 z" fill="#3b2216"/>
  <path d="M648 292 q18 -16 32 -2 q-16 0 -22 12 z" fill="#4a2c1c"/>
  <!-- glass rim + reflections -->
  <ellipse cx="600" cy="300" rx="132" ry="36" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.95"/>
  <path d="M492 372 L512 642" stroke="#ffffff" stroke-width="13" opacity="0.32" stroke-linecap="round"/>
  <path d="M702 390 L690 600" stroke="#ffffff" stroke-width="8" opacity="0.22" stroke-linecap="round"/>
  <!-- cocoa dust -->
  <circle cx="410" cy="620" r="4" fill="#3b2216" opacity="0.45"/>
  <circle cx="392" cy="646" r="3" fill="#3b2216" opacity="0.35"/>
  <circle cx="815" cy="600" r="4" fill="#3b2216" opacity="0.35"/>
  <circle cx="838" cy="572" r="3" fill="#3b2216" opacity="0.3"/>
</g>
<g transform="translate(855 240) rotate(16) scale(0.85)">
  <path d="M0 0 C 30 -20, 80 -22, 120 0" stroke="#2f7a48" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="24" cy="-14" rx="17" ry="8" fill="#3a8a52" transform="rotate(-28 24 -14)"/>
  <ellipse cx="56" cy="-20" rx="17" ry="8" fill="#2f7a48" transform="rotate(-12 56 -20)"/>
  <ellipse cx="88" cy="-19" rx="16" ry="8" fill="#3a8a52" transform="rotate(8 88 -19)"/>
  <ellipse cx="34" cy="6" rx="16" ry="8" fill="#2f7a48" transform="rotate(24 34 6)"/>
  <ellipse cx="68" cy="2" rx="16" ry="8" fill="#3a8a52" transform="rotate(18 68 2)"/>
</g>
</svg>
