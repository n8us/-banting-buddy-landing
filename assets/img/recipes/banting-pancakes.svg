    <rect x="-54" y="-36" width="108" height="60" rx="10" fill="#f6dd9a"/>
    <rect x="-54" y="-36" width="108" height="20" rx="10" fill="#fdf0c6"/>
    <path d="M-30 10 L30 10" stroke="#e6c97e" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>
