  <ellipse cx="600" cy="588" rx="210" ry="38" fill="#e8b978" opacity="0.6"/>

  <ellipse cx="600" cy="554" rx="233" ry="58" fill="#c1853f"/>
  <ellipse cx="600" cy="542" rx="233" ry="54" fill="#dda65e"/>
  <ellipse cx="600" cy="534" rx="207" ry="38" fill="#e8b978" opacity="0.6"/>

  <ellipse cx="600" cy="500" rx="230" ry="58" fill="#c1853f"/>
  <ellipse cx="600" cy="488" rx="230" ry="54" fill="#dda65e"/>
  <ellipse cx="600" cy="480" rx="204" ry="38" fill="#e8b978" opacity="0.6"/>

  <ellipse cx="600" cy="446" rx="227" ry="58" fill="#c1853f"/>
  <ellipse cx="600" cy="434" rx="227" ry="54" fill="#dda65e"/>
  <ellipse cx="600" cy="426" rx="201" ry="38" fill="#e8b978" opacity="0.6"/>

  <ellipse cx="600" cy="392" rx="224" ry="58" fill="#c1853f"/>
  <ellipse cx="600" cy="380" rx="224" ry="54" fill="#dda65e"/>
