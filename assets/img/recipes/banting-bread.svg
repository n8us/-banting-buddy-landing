<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs>
  <radialGradient id="bg" cx="50%" cy="34%" r="82%">
    <stop offset="0%" stop-color="#f3f6ef"/>
    <stop offset="62%" stop-color="#e6ece2"/>
    <stop offset="100%" stop-color="#d2ddd1"/>
  </radialGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#f3ece0"/>
  </linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#4a2c1c"/>
    <stop offset="100%" stop-color="#2b1710"/>
  </linearGradient>
  <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e8bd82"/>
    <stop offset="100%" stop-color="#d2a061"/>
  </linearGradient>
  <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e2ad68"/>
    <stop offset="100%" stop-color="#c68a44"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="18%" stop-color="#ffffff" stop-opacity="0.06"/>
    <stop offset="82%" stop-color="#ffffff" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
  </linearGradient>
  <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
  <filter id="blur-s" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<ellipse cx="600" cy="530" rx="400" ry="325" fill="#7d8c78" opacity="0.30" filter="url(#blur)"/>
<ellipse cx="600" cy="480" rx="360" ry="335" fill="#77866f" opacity="0.18" filter="url(#blur-s)"/>
<ellipse cx="600" cy="470" rx="355" ry="335" fill="url(#plate)"/>
<ellipse cx="600" cy="470" rx="355" ry="335" fill="none" stroke="#d9d3c3" stroke-width="3"/>
<ellipse cx="600" cy="470" rx="300" ry="282" fill="none" stroke="#e5dcc8" stroke-width="2"/>

<g>
  <ellipse cx="600" cy="610" rx="270" ry="60" fill="#8a6a3d" opacity="0.22" filter="url(#blur-s)"/>
  <!-- slice behind -->
  <g transform="translate(770 470) rotate(8)">
    <rect x="-70" y="-110" width="140" height="215" rx="24" fill="#e0b57a"/>
    <rect x="-52" y="-92" width="104" height="179" rx="16" fill="#efd0a1"/>
    <circle cx="-22" cy="-30" r="5" fill="#d6b184" opacity="0.8"/>
    <circle cx="18" cy="20" r="4" fill="#d6b184" opacity="0.8"/>
    <circle cx="-10" cy="70" r="4" fill="#d6b184" opacity="0.7"/>
  </g>
  <!-- loaf -->
  <g>
    <rect x="385" y="330" width="330" height="230" rx="58" fill="#b9803f"/>
    <rect x="385" y="330" width="330" height="86" rx="58" fill="#c9944f"/>
    <path d="M430 360 q60 -26 120 0 M 520 356 q60 -26 120 0" stroke="#a56f33" stroke-width="7" fill="none" opacity="0.5"/>
    <circle cx="450" cy="470" r="5" fill="#8f5f2c" opacity="0.45"/>
    <circle cx="520" cy="500" r="4" fill="#8f5f2c" opacity="0.4"/>
    <circle cx="610" cy="470" r="5" fill="#8f5f2c" opacity="0.4"/>
    <circle cx="660" cy="510" r="4" fill="#8f5f2c" opacity="0.35"/>
    <!-- seeds -->
    <ellipse cx="470" cy="352" rx="7" ry="4" fill="#7d5a2c" transform="rotate(-20 470 352)"/>
    <ellipse cx="560" cy="346" rx="7" ry="4" fill="#7d5a2c" transform="rotate(12 560 346)"/>
    <ellipse cx="640" cy="352" rx="7" ry="4" fill="#7d5a2c" transform="rotate(-8 640 352)"/>
    <ellipse cx="515" cy="342" rx="6" ry="3.5" fill="#8a7a3f" transform="rotate(30 515 342)"/>
    <ellipse cx="695" cy="360" rx="6" ry="3.5" fill="#8a7a3f" transform="rotate(18 695 360)"/>
  </g>
  <!-- front slice -->
  <g transform="translate(430 600) rotate(-6)">
    <rect x="-95" y="-30" width="190" height="62" rx="14" fill="#e0b57a"/>
    <rect x="-95" y="-30" width="190" height="20" rx="10" fill="#efd0a1"/>
    <circle cx="-40" cy="6" r="4" fill="#d6b184"/>
    <circle cx="20" cy="12" r="3.5" fill="#d6b184"/>
  </g>
  {herb(300, 300, 0.8, 150)}
</g>
</svg>
