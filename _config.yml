title: Banting Buddy
description: Banting and LCHF guides, food questions and the Banting Buddy app
url: "https://n8us.github.io"
baseurl: "/-banting-buddy-landing"
permalink: pretty

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

analytics:
  # GoatCounter site code (cookieless click tracking).
  # Sign up at goatcounter.com, then put the code here — e.g. if your
  # dashboard is bantingbuddy.goatcounter.com, use "bantingbuddy".
  # Leave empty to disable the script.
  goatcounter: ""

defaults:
  - scope:
      path: "questions"
    values:
      layout: "question"
  - scope:
      path: "guides"
    values:
      layout: "default"
  - scope:
      path: "compare"
    values:
      layout: "default"
